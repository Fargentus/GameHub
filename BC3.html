<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle City 1990 - 2-Player Co-op Retro NES Tanks</title>
    <!-- Tailwind CSS for fluid layout and utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0a0a0e;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .crt-overlay::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.5;
        }

        .blink {
            animation: blinker 0.8s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        .dpad-btn {
            background: #252533;
            border: 2px solid #555;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 3px 0 #111;
        }
        .dpad-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 0 #111;
            background: #38384d;
        }

        .fire-btn-p1 {
            background: linear-gradient(135deg, #e69d00, #b37700);
            border: 2px solid #ffe082;
            box-shadow: 0 4px 0 #664400;
        }
        .fire-btn-p1:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #664400;
        }

        .fire-btn-p2 {
            background: linear-gradient(135deg, #00c853, #007e33);
            border: 2px solid #b9f6ca;
            box-shadow: 0 4px 0 #004d1a;
        }
        .fire-btn-p2:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #004d1a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none">

    <div class="w-full max-w-5xl flex flex-col items-center">
        <!-- Title Header Bar -->

            <h1 class="text-xl sm:text-3xl text-yellow-400 tracking-wider font-bold drop-shadow-[0_3px_0_#9a6700]">
                BATTLE CITY 1990
            </h1>
            <p class="text-[9px] sm:text-xs text-green-400 mt-1">2-PLAYER CO-OP NES EDITION</p>
        </header>

        <!-- Main Arcade Machine Box -->
        <div class="relative bg-neutral-900 border-4 border-neutral-700 p-2 sm:p-4 rounded-xl shadow-2xl crt-overlay flex flex-col items-center w-full max-w-4xl">
            
            <!-- Top Dashboard Bar -->
            <div id="top-bar" class="w-full max-w-[580px] bg-neutral-800 border-2 border-neutral-600 mb-2 p-2 flex justify-between items-center text-[9px] sm:text-xs">
                <div class="flex items-center gap-1 text-red-500">
                    <span>HI-SCORE:</span>
                    <span id="high-score-val" class="text-white">000000</span>
                </div>
                <div class="flex items-center gap-1 text-yellow-400">
                    <span>MODE:</span>
                    <span id="mode-display-val" class="text-white">2-PLAYER</span>
                </div>
                <button id="audio-toggle-btn" class="bg-neutral-700 hover:bg-neutral-600 text-yellow-300 px-2 py-1 rounded text-[9px] border border-neutral-500">
                    🔊 SOUND

            </div>

            <!-- Game Arena Wrapper (Canvas + Side Dashboard) -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-2 bg-black p-2 border-4 border-neutral-800 rounded w-full">
                
                <!-- 3D Perspective Game Canvas Wrapper -->
                <div class="relative" style="perspective: 1000px;">
                    <canvas id="gameCanvas" width="416" height="416" 
                            style="transform: rotateX(15deg) scale(0.95); transform-origin: bottom center; box-shadow: 0 30px 40px rgba(0,0,0,0.9), 0 -2px 10px rgba(255, 234, 0, 0.1);" 
                            class="bg-black block border-4 border-neutral-700 max-w-full h-auto aspect-square transition-transform duration-500 hover:rotate-0"></canvas>
                </div>

                <!-- Side Dashboard HUD (Classic NES Style) -->
                <div id="side-hud" class="bg-neutral-800 w-full md:w-32 h-auto md:h-[416px] p-2 flex flex-row md:flex-col justify-between md:justify-start items-center border-2 border-neutral-700 text-[10px] gap-2">
                    
                    <!-- Remaining Enemies Icons Grid -->
                    <div class="w-full flex flex-col items-center">
                        <span class="text-[8px] text-gray-400 mb-1 hidden md:block">ENEMIES</span>
                        <div id="enemy-icons-container" class="grid grid-cols-10 md:grid-cols-2 gap-1 justify-center max-w-[160px] md:max-w-none">
                            <!-- Enemy reserve tank icons injected by JS -->
                        </div>
                    </div>

                    <hr class="w-full border-neutral-600 my-1 hidden md:block" />

                    <!-- Player 1 Stats -->
                    <div class="flex md:flex-col items-center gap-1 text-yellow-400">
                        <div class="flex items-center gap-1 font-bold">
                            <span>1P</span>
                            <span class="text-yellow-500">🟡</span>
                        </div>
                        <div class="flex flex-col text-right md:text-center text-[9px]">
                            <span id="p1-score-val" class="text-white">0000</span>
                            <span class="text-gray-400">LIVES: <span id="p1-lives-val" class="text-yellow-400 font-bold">10</span></span>
                            <span class="text-gray-400">TIER: <span id="p1-tier-val" class="text-white">0</span></span>
                        </div>
                    </div>

                    <hr class="w-full border-neutral-600 my-1 hidden md:block" />

                    <!-- Player 2 Stats -->
                    <div id="p2-hud-box" class="flex md:flex-col items-center gap-1 text-green-400">
                        <div class="flex items-center gap-1 font-bold">

                        <div class="flex flex-col text-right md:text-center text-[9px]">
                            <span id="p2-score-val" class="text-white">0000</span>
                            <span class="text-gray-400">LIVES: <span id="p2-lives-val" class="text-green-400 font-bold">10</span></span>
                            <span class="text-gray-400">TIER: <span id="p2-tier-val" class="text-white">0</span></span>
                        </div>
                    </div>

                    <hr class="w-full border-neutral-600 my-1 hidden md:block" />

                    <!-- Stage Number Flag -->
                    <div class="flex md:flex-col items-center gap-1">
                        <span class="text-red-500 text-base">🚩</span>
                        <div class="text-center">
                            <span class="text-[8px] text-gray-400 block">STAGE</span>
                            <span id="stage-num-val" class="text-white font-bold text-xs">1</span>

                    </div>

                    <button id="pause-btn" class="mt-auto bg-yellow-600 hover:bg-yellow-500 text-black font-bold px-2 py-1 rounded text-[8px] border border-yellow-300 w-full hidden md:block">
                        PAUSE (P)

            </div>

            <!-- Mobile Touch Dual Controller Setup -->
            <div id="mobile-controls" class="w-full max-w-[580px] mt-2 bg-neutral-800 rounded border border-neutral-700 p-2 md:hidden">
                <div class="flex justify-around items-center border-b border-neutral-700 pb-1 mb-2">
                    <button id="tab-p1-btn" class="text-xs font-bold text-yellow-400 bg-neutral-700 px-3 py-1 rounded border border-yellow-500">P1 CONTROLS</button>
                    <button id="tab-p2-btn" class="text-xs font-bold text-green-400 bg-neutral-900 px-3 py-1 rounded border border-neutral-600">P2 CONTROLS</button>
                    <button id="btn-pause-mobile" class="bg-neutral-700 text-yellow-300 px-2 py-1 rounded text-[9px] border border-neutral-500">PAUSE</button>
                </div>

                <!-- P1 Touch Controls Grid -->
                <div id="p1-touch-group" class="grid grid-cols-2 gap-2">
                    <div class="grid grid-cols-3 gap-1 w-32 h-32 mx-auto items-center justify-center">
                        <div></div>
                        <button id="p1-btn-up" class="dpad-btn rounded-t h-10 text-base text-yellow-400">▲</button>
                        <div></div>
                        <button id="p1-btn-left" class="dpad-btn rounded-l h-10 text-base text-yellow-400">◄</button>
                        <div class="bg-neutral-700 h-10 rounded-sm flex items-center justify-center text-[7px] text-yellow-400">P1</div>
                        <button id="p1-btn-right" class="dpad-btn rounded-r h-10 text-base text-yellow-400">►</button>

                        <button id="p1-btn-down" class="dpad-btn rounded-b h-10 text-base text-yellow-400">▼</button>

                    </div>
                    <div class="flex items-center justify-center">
                        <button id="p1-btn-fire" class="fire-btn-p1 w-20 h-20 rounded-full text-black font-bold text-xs tracking-wider flex items-center justify-center">
                            FIRE
                        </button>
                    </div>
                </div>

                <!-- P2 Touch Controls Grid (Hidden by default or toggled) -->
                <div id="p2-touch-group" class="grid grid-cols-2 gap-2 hidden">
                    <div class="grid grid-cols-3 gap-1 w-32 h-32 mx-auto items-center justify-center">
                        <div></div>
                        <button id="p2-btn-up" class="dpad-btn rounded-t h-10 text-base text-green-400">▲</button>
                        <div></div>
                        <button id="p2-btn-left" class="dpad-btn rounded-l h-10 text-base text-green-400">◄</button>
                        <div class="bg-neutral-700 h-10 rounded-sm flex items-center justify-center text-[7px] text-green-400">P2</div>
                        <button id="p2-btn-right" class="dpad-btn rounded-r h-10 text-base text-green-400">►</button>
                        <div></div>
                        <button id="p2-btn-down" class="dpad-btn rounded-b h-10 text-base text-green-400">▼</button>
                        <div></div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button id="p2-btn-fire" class="fire-btn-p2 w-20 h-20 rounded-full text-black font-bold text-xs tracking-wider flex items-center justify-center">
                            FIRE
                        </button>
                    </div>
                </div>
            </div>

            <!-- Keybind Instructions Helper -->
            <footer class="mt-2 text-[8px] sm:text-[9px] text-gray-400 text-center max-w-xl leading-relaxed">
                <div class="text-yellow-400 font-bold mb-1">KEYBOARD CONTROLS</div>
                <div><span class="text-yellow-300 font-bold">P1 (Yellow):</span> Move: <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">WASD</kbd> | Fire: <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">SPACE</kbd> or <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">J</kbd></div>
                <div><span class="text-green-300 font-bold">P2 (Green):</span> Move: <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">ARROWS</kbd> | Fire: <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">ENTER</kbd> or <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">K</kbd> / <kbd class="bg-neutral-800 px-1 border border-neutral-600 rounded">NUM 0</kbd></div>
            </footer>
        </div>
    </div>

    <script>
        /* =========================================================================
           BATTLE CITY 1990 - 2-PLAYER CO-OP ENGINE
           ========================================================================= */

        const MAP_SIZE = 26; // 26x26 micro-tiles grid
        const TILE_SIZE = 16; // Each tile is 16x16 pixels
        const CANVAS_SIZE = MAP_SIZE * TILE_SIZE; // 416x416 px total

        // Tile Constants
        const TILE_EMPTY = 0;
        const TILE_BRICK = 1;
        const TILE_STEEL = 2;
        const TILE_WATER = 3;
        const TILE_TREES = 4;
        const TILE_ICE = 5;
        const TILE_EAGLE = 9;
        const TILE_EAGLE_DESTROYED = 10;

        // Directions: 0: UP, 1: RIGHT, 2: DOWN, 3: LEFT
        const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
        const DX = [0, 1, 0, -1];
        const DY = [-1, 0, 1, 0];

        class RetroAudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, gainVal = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playShoot() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(480, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e) {}
            }

            playExplosion(large = false) {
                if (this.muted || !this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * (large ? 0.35 : 0.15);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(large ? 400 : 800, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + (large ? 0.35 : 0.15));

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (large ? 0.35 : 0.15));

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }

            playPowerup() {
                if (this.muted || !this.ctx) return;
                const notes = [300, 400, 500, 600, 750, 900];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'square', 0.08, 0.12), idx * 60);
                });
            }

            playStun() {
                this.playTone(150, 'sawtooth', 0.2, 0.25);
            }

            playSteelHit() {
                this.playTone(220, 'sawtooth', 0.08, 0.2);
            }

            playBrickHit() {
                this.playTone(120, 'triangle', 0.06, 0.15);
            }

            playStartJingle() {
                if (this.muted || !this.ctx) return;
                const melody = [
                    {f: 392, d: 0.1}, {f: 523, d: 0.1}, {f: 659, d: 0.1},
                    {f: 784, d: 0.2}, {f: 659, d: 0.1}, {f: 784, d: 0.3}
                ];
                let time = 0;
                melody.forEach(item => {
                    setTimeout(() => this.playTone(item.f, 'square', item.d, 0.15), time * 1000);
                    time += item.d + 0.03;
                });
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                const notes = [400, 350, 300, 250, 200, 150];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sawtooth', 0.15, 0.2), idx * 120);
                });
            }
        }

        const audio = new RetroAudioEngine();

        function createStageMap(stageNum) {
            const grid = Array.from({ length: MAP_SIZE }, () => new Array(MAP_SIZE).fill(TILE_EMPTY));

            // Eagle Base at bottom center (cols 12..13, rows 24..25)
            grid[24][12] = TILE_EAGLE; grid[24][13] = TILE_EAGLE;
            grid[25][12] = TILE_EAGLE; grid[25][13] = TILE_EAGLE;

            // Protective Brick Wall around Base
            const baseBricks = [
                [23,11],[23,12],[23,13],[23,14],
                [24,11],[24,14],
                [25,11],[25,14]
            ];
            baseBricks.forEach(([r, c]) => grid[r][c] = TILE_BRICK);

            if (stageNum === 1) {
                const brickBlocks = [
                    ...getRect(2, 2, 8, 2), ...getRect(2, 6, 8, 2), ...getRect(2, 10, 8, 2),
                    ...getRect(2, 14, 8, 2), ...getRect(2, 18, 8, 2), ...getRect(2, 22, 8, 2),
                    ...getRect(12, 2, 2, 6), ...getRect(12, 18, 2, 6), ...getRect(15, 10, 2, 6),
                    ...getRect(18, 2, 4, 2), ...getRect(18, 6, 4, 2), ...getRect(18, 18, 4, 2), ...getRect(18, 22, 4, 2)
                ];
                brickBlocks.forEach(([r, c]) => grid[r][c] = TILE_BRICK);

                const steelBlocks = [...getRect(12, 12, 2, 2)];
                steelBlocks.forEach(([r, c]) => grid[r][c] = TILE_STEEL);

            } else if (stageNum === 2) {
                const brickBlocks = [
                    ...getRect(2, 2, 6, 4), ...getRect(2, 20, 6, 4),
                    ...getRect(14, 4, 4, 4), ...getRect(14, 18, 4, 4)
                ];
                brickBlocks.forEach(([r, c]) => grid[r][c] = TILE_BRICK);

                const steelBlocks = [...getRect(2, 10, 2, 6), ...getRect(10, 12, 4, 2)];
                steelBlocks.forEach(([r, c]) => grid[r][c] = TILE_STEEL);

                const waterBlocks = [...getRect(10, 2, 2, 8), ...getRect(10, 16, 2, 8)];
                waterBlocks.forEach(([r, c]) => grid[r][c] = TILE_WATER);

                const treeBlocks = [...getRect(16, 10, 4, 6), ...getRect(20, 2, 4, 4)];
                treeBlocks.forEach(([r, c]) => grid[r][c] = TILE_TREES);

            } else {
                for (let r = 2; r < 22; r += 4) {
                    for (let c = 2; c < 24; c += 4) {
                        const typeRand = (r + c + stageNum) % 6;
                        let tileType = TILE_BRICK;
                        if (typeRand === 1) tileType = TILE_STEEL;
                        else if (typeRand === 2) tileType = TILE_TREES;
                        else if (typeRand === 3) tileType = TILE_WATER;
                        else if (typeRand === 4) tileType = TILE_ICE;

                        const rect = getRect(r, c, 3, 3);
                        rect.forEach(([rr, cc]) => {
                            if (rr < 23 && cc >= 0 && cc < MAP_SIZE) {
                                grid[rr][cc] = tileType;
                            }
                        });
                    }
                }
            }

            return grid;
        }

        function getRect(startRow, startCol, height, width) {
            const coords = [];
            for (let r = startRow; r < startRow + height; r++) {
                for (let c = startCol; c < startCol + width; c++) {
                    if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE) {
                        coords.push([r, c]);
                    }
                }
            }
            return coords;
        }

        class Explosion {
            constructor(x, y, isLarge = false) {
                this.x = x;
                this.y = y;
                this.isLarge = isLarge;
                this.frame = 0;
                this.maxFrames = isLarge ? 12 : 6;
                this.finished = false;
            }

            update() {
                this.frame++;
                if (this.frame >= this.maxFrames) this.finished = true;
            }

            draw(ctx) {
                const radius = this.isLarge ? (this.frame * 2.5) + 4 : (this.frame * 1.5) + 2;
                ctx.save();
                ctx.fillStyle = this.frame % 2 === 0 ? '#ffea00' : '#ff2200';
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fill();

                if (this.isLarge && this.frame > 3) {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, dir, speed, ownerPlayerId, tier = 0) {
                this.x = x;
                this.y = y;
                this.dir = dir;
                this.speed = speed;
                this.ownerPlayerId = ownerPlayerId; // 1 = P1, 2 = P2, 0 = Enemy
                this.tier = tier; // Tier 3 destroys steel
                this.size = 4;
                this.active = true;
            }

            update() {
                this.x += DX[this.dir] * this.speed;
                this.y += DY[this.dir] * this.speed;

                if (this.x < 0 || this.x > CANVAS_SIZE || this.y < 0 || this.y > CANVAS_SIZE) {
                    this.active = false;
                }
            }

            getBounds() {
                return {
                    left: this.x - this.size / 2,
                    right: this.x + this.size / 2,
                    top: this.y - this.size / 2,
                    bottom: this.y + this.size / 2
                };
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.ownerPlayerId === 1 ? '#ffea00' : (this.ownerPlayerId === 2 ? '#00e676' : '#ffffff');
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'star', 'bomb', 'clock', 'shovel', 'helmet', 'tank'
                this.duration = 600;
                this.flashTimer = 0;
            }

            update() {
                this.duration--;
                this.flashTimer++;
            }

            draw(ctx) {
                if (this.duration < 100 && Math.floor(this.flashTimer / 8) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, 24, 24);
                ctx.strokeStyle = '#e62020';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, 24, 24);

                ctx.font = '12px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let symbol = '★';
                if (this.type === 'star') symbol = '★';
                else if (this.type === 'bomb') symbol = '💣';
                else if (this.type === 'clock') symbol = '⏱️';
                else if (this.type === 'shovel') symbol = '🛡️';
                else if (this.type === 'helmet') symbol = '🪖';
                else if (this.type === 'tank') symbol = '🛞';

                ctx.fillText(symbol, 12, 12);
                ctx.restore();
            }
        }

        class Tank {
            constructor(x, y, playerId = 0, enemyType = 'basic') {
                this.x = x;
                this.y = y;
                this.size = 28;
                this.dir = DIR.UP;
                this.playerId = playerId; // 1 = P1, 2 = P2, 0 = Enemy
                this.isPlayer = playerId > 0;
                this.enemyType = enemyType; // 'basic', 'fast', 'power', 'armor'
                
                this.speed = this.isPlayer ? 1.8 : 1.0;
                this.hp = 1;
                this.maxHp = 1;
                this.tier = 0; // Tiers 0..3
                this.isFlashing = false;

                if (!this.isPlayer) {
                    if (enemyType === 'fast') this.speed = 2.4;
                    else if (enemyType === 'power') this.speed = 1.2;
                    else if (enemyType === 'armor') { this.hp = 4; this.maxHp = 4; this.speed = 1.0; }
                }

                this.invincibleTimer = this.isPlayer ? 180 : 0;
                this.stunTimer = 0; // Friendly fire stun
                this.shootCooldown = 0;
                this.trackFrame = 0;
                this.aiChangeDirTimer = 0;
            }

            getBounds() {
                return {
                    left: this.x,
                    right: this.x + this.size,
                    top: this.y,
                    bottom: this.y + this.size
                };
            }

            update(map, tanks, freezeEnemies) {
                if (this.invincibleTimer > 0) this.invincibleTimer--;
                if (this.stunTimer > 0) this.stunTimer--;
                if (this.shootCooldown > 0) this.shootCooldown--;

                if (!this.isPlayer && freezeEnemies) return;

                this.trackFrame = (this.trackFrame + 1) % 10;
            }

            canMoveTo(newX, newY, map, tanks) {
                if (newX < 0 || newX + this.size > CANVAS_SIZE || newY < 0 || newY + this.size > CANVAS_SIZE) {
                    return false;
                }

                const leftTile = Math.floor(newX / TILE_SIZE);
                const rightTile = Math.floor((newX + this.size - 0.1) / TILE_SIZE);
                const topTile = Math.floor(newY / TILE_SIZE);
                const bottomTile = Math.floor((newY + this.size - 0.1) / TILE_SIZE);

                for (let r = topTile; r <= bottomTile; r++) {
                    for (let c = leftTile; c <= rightTile; c++) {
                        const tile = map[r][c];
                        if (tile === TILE_BRICK || tile === TILE_STEEL || tile === TILE_WATER || tile === TILE_EAGLE || tile === TILE_EAGLE_DESTROYED) {
                            return false;
                        }
                    }
                }

                const myBounds = { left: newX, right: newX + this.size, top: newY, bottom: newY + this.size };
                for (let other of tanks) {
                    if (other === this) continue;
                    const ob = other.getBounds();
                    if (myBounds.left < ob.right && myBounds.right > ob.left &&
                        myBounds.top < ob.bottom && myBounds.bottom > ob.top) {
                        return false;
                    }
                }

                return true;
            }

            move(dir, map, tanks) {
                if (this.stunTimer > 0) return false; // Stunned by teammate friendly fire

                this.dir = dir;
                let nextX = this.x + DX[dir] * this.speed;
                let nextY = this.y + DY[dir] * this.speed;

                const centerCol = Math.floor((this.x + this.size / 2) / TILE_SIZE);
                const centerRow = Math.floor((this.y + this.size / 2) / TILE_SIZE);
                const isOnIce = map[centerRow] && map[centerRow][centerCol] === TILE_ICE;
                
                if (isOnIce) {
                    nextX += DX[dir] * 0.5;
                    nextY += DY[dir] * 0.5;
                }

                if (dir === DIR.UP || dir === DIR.DOWN) {
                    const gridX = Math.round(this.x / 8) * 8;
                    if (Math.abs(this.x - gridX) < 4) this.x = gridX;
                } else {
                    const gridY = Math.round(this.y / 8) * 8;
                    if (Math.abs(this.y - gridY) < 4) this.y = gridY;
                }

                if (this.canMoveTo(nextX, nextY, map, tanks)) {
                    this.x = nextX;
                    this.y = nextY;
                    return true;
                }
                return false;
            }

            shoot(activeBulletsCount) {
                if (this.stunTimer > 0 || this.shootCooldown > 0) return null;

                // Max bullets limit: Tier 0-1 = 1 bullet, Tier 2-3 = 2 bullets
                const maxBullets = (this.isPlayer && this.tier >= 2) ? 2 : 1;
                if (activeBulletsCount >= maxBullets) return null;

                let bulletSpeed = 4.5;
                if (!this.isPlayer && this.enemyType === 'power') bulletSpeed = 6.0;
                if (this.isPlayer && this.tier >= 1) bulletSpeed = 6.5;

                this.shootCooldown = this.isPlayer ? (this.tier >= 2 ? 14 : 22) : 45;

                let bx = this.x + this.size / 2;
                let by = this.y + this.size / 2;
                const offset = this.size / 2 + 2;

                bx += DX[this.dir] * offset;
                by += DY[this.dir] * offset;

                audio.playShoot();
                return new Bullet(bx, by, this.dir, bulletSpeed, this.playerId, this.tier);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate((this.dir * 90 * Math.PI) / 180);

                let bodyColor = '#e69d00'; // Player 1 (Yellow)
                let treadColor = '#333';

                if (this.playerId === 1) {
                    bodyColor = '#e69d00';
                    if (this.tier === 1) bodyColor = '#f5b041';
                    if (this.tier === 2) bodyColor = '#f39c12';
                    if (this.tier >= 3) bodyColor = '#d35400';
                } else if (this.playerId === 2) {
                    bodyColor = '#00c853'; // Player 2 (Green)
                    if (this.tier === 1) bodyColor = '#2ecc71';
                    if (this.tier === 2) bodyColor = '#27ae60';
                    if (this.tier >= 3) bodyColor = '#1e8449';
                } else {
                    // Enemies
                    if (this.isFlashing && Math.floor(Date.now() / 150) % 2 === 0) {
                        bodyColor = '#ff1744';
                    } else if (this.enemyType === 'basic') {
                        bodyColor = '#cccccc';
                    } else if (this.enemyType === 'fast') {
                        bodyColor = '#ffeb3b';
                    } else if (this.enemyType === 'power') {
                        bodyColor = '#aa00ff';
                    } else if (this.enemyType === 'armor') {
                        if (this.hp === 4) bodyColor = '#2e7d32';
                        else if (this.hp === 3) bodyColor = '#fbc02d';
                        else if (this.hp === 2) bodyColor = '#e65100';
                        else bodyColor = '#c62828';
                    }
                }

                const s = this.size;
                const h = s / 2;

                // Render treads
                ctx.fillStyle = treadColor;
                ctx.fillRect(-h, -h, 5, s);
                ctx.fillRect(h - 5, -h, 5, s);

                ctx.fillStyle = '#666';
                if (this.trackFrame > 5) {
                    ctx.fillRect(-h, -h + 2, 5, 4);
                    ctx.fillRect(h - 5, -h + 2, 5, 4);
                    ctx.fillRect(-h, -h + 14, 5, 4);
                    ctx.fillRect(h - 5, -h + 14, 5, 4);
                } else {
                    ctx.fillRect(-h, -h + 8, 5, 4);
                    ctx.fillRect(h - 5, -h + 8, 5, 4);
                }

                // Armor body
                ctx.fillStyle = bodyColor;
                ctx.fillRect(-h + 5, -h + 4, s - 10, s - 8);

                // Turret center
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();

                // Cannon barrel
                ctx.fillStyle = bodyColor;
                ctx.fillRect(-2, -h - 2, 4, h + 2);

                ctx.restore();

                // Draw Invincibility Shield
                if (this.invincibleTimer > 0) {
                    ctx.save();
                    ctx.strokeStyle = Math.floor(this.invincibleTimer / 4) % 2 === 0 ? '#00e5ff' : '#ffea00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2 + 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Draw Friendly Fire Stun Stars Effect
                if (this.stunTimer > 0) {
                    ctx.save();
                    ctx.fillStyle = '#ffeb3b';
                    ctx.font = '10px sans-serif';
                    ctx.fillText('💫', this.x + 8, this.y - 4);
                    ctx.restore();
                }
            }
        }

        class BattleCityGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.state = 'TITLE'; // TITLE, STAGE_INTRO, PLAYING, PAUSED, GAME_OVER, STAGE_CLEAR
                this.isTwoPlayer = true;
                this.selectedMenuOption = 1; // 0 = 1 Player, 1 = 2 Players

                this.stage = 1;
                this.highScore = parseInt(localStorage.getItem('bc_high_score_2p') || '0');

                this.p1Score = 0;
                this.p1Lives = 10;
                this.p2Score = 0;
                this.p2Lives = 10;

                this.map = [];
                this.player1 = null;
                this.player2 = null;
                this.enemies = [];
                this.bullets = [];
                this.explosions = [];
                this.powerUps = [];

                this.remainingEnemiesToSpawn = [];
                this.spawnTimer = 0;
                this.freezeEnemiesTimer = 0;
                this.shovelTimer = 0;

                this.keys = {};
                
                // Touch Controller States
                this.p1TouchDir = null;
                this.p1TouchFire = false;
                this.p2TouchDir = null;
                this.p2TouchFire = false;

                this.initUI();
                this.bindInputEvents();
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            initUI() {
                document.getElementById('high-score-val').innerText = String(this.highScore).padStart(6, '0');
                document.getElementById('p1-score-val').innerText = String(this.p1Score).padStart(4, '0');
                document.getElementById('p1-lives-val').innerText = this.p1Lives;
                document.getElementById('p2-score-val').innerText = String(this.p2Score).padStart(4, '0');
                document.getElementById('p2-lives-val').innerText = this.p2Lives;
                document.getElementById('stage-num-val').innerText = this.stage;
                document.getElementById('mode-display-val').innerText = this.isTwoPlayer ? '2-PLAYER' : '1-PLAYER';
            }

            bindInputEvents() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    this.keys[e.code] = true;

                    if (this.state === 'TITLE') {
                        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                            this.selectedMenuOption = 0;
                        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                            this.selectedMenuOption = 1;
                        } else if (e.key === 'Enter' || e.key === ' ') {
                            this.isTwoPlayer = (this.selectedMenuOption === 1);
                            this.startNewGame();
                        }
                    } else if (this.state === 'GAME_OVER') {
                        if (e.key === 'Enter' || e.key === ' ') {
                            this.state = 'TITLE';
                        }
                    } else {
                        if (e.key === 'p' || e.key === 'P') this.togglePause();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                    this.keys[e.code] = false;
                });

                // Audio Button
                document.getElementById('audio-toggle-btn').addEventListener('click', () => {
                    audio.init();
                    audio.muted = !audio.muted;
                    document.getElementById('audio-toggle-btn').innerText = audio.muted ? '🔇 MUTED' : '🔊 SOUND';
                });

                // Pause Buttons
                document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());
                document.getElementById('btn-pause-mobile').addEventListener('click', () => this.togglePause());

                const setupTouchBtn = (id, callbackStart, callbackEnd) => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); callbackStart(); });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); callbackEnd(); });
                    btn.addEventListener('mousedown', () => { audio.init(); callbackStart(); });
                    btn.addEventListener('mouseup', () => { callbackEnd(); });
                };

                // P1 Touch Mapping
                setupTouchBtn('p1-btn-up', () => this.p1TouchDir = DIR.UP, () => { if (this.p1TouchDir === DIR.UP) this.p1TouchDir = null; });
                setupTouchBtn('p1-btn-right', () => this.p1TouchDir = DIR.RIGHT, () => { if (this.p1TouchDir === DIR.RIGHT) this.p1TouchDir = null; });
                setupTouchBtn('p1-btn-down', () => this.p1TouchDir = DIR.DOWN, () => { if (this.p1TouchDir === DIR.DOWN) this.p1TouchDir = null; });
                setupTouchBtn('p1-btn-left', () => this.p1TouchDir = DIR.LEFT, () => { if (this.p1TouchDir === DIR.LEFT) this.p1TouchDir = null; });
                setupTouchBtn('p1-btn-fire', () => this.p1TouchFire = true, () => this.p1TouchFire = false);

                // P2 Touch Mapping
                setupTouchBtn('p2-btn-up', () => this.p2TouchDir = DIR.UP, () => { if (this.p2TouchDir === DIR.UP) this.p2TouchDir = null; });
                setupTouchBtn('p2-btn-right', () => this.p2TouchDir = DIR.RIGHT, () => { if (this.p2TouchDir === DIR.RIGHT) this.p2TouchDir = null; });
                setupTouchBtn('p2-btn-down', () => this.p2TouchDir = DIR.DOWN, () => { if (this.p2TouchDir === DIR.DOWN) this.p2TouchDir = null; });
                setupTouchBtn('p2-btn-left', () => this.p2TouchDir = DIR.LEFT, () => { if (this.p2TouchDir === DIR.LEFT) this.p2TouchDir = null; });
                setupTouchBtn('p2-btn-fire', () => this.p2TouchFire = true, () => this.p2TouchFire = false);

                // Mobile Touch Tab Toggle
                document.getElementById('tab-p1-btn').addEventListener('click', () => {
                    document.getElementById('p1-touch-group').classList.remove('hidden');
                    document.getElementById('p2-touch-group').classList.add('hidden');
                    document.getElementById('tab-p1-btn').className = 'text-xs font-bold text-yellow-400 bg-neutral-700 px-3 py-1 rounded border border-yellow-500';
                    document.getElementById('tab-p2-btn').className = 'text-xs font-bold text-green-400 bg-neutral-900 px-3 py-1 rounded border border-neutral-600';
                });

                document.getElementById('tab-p2-btn').addEventListener('click', () => {
                    document.getElementById('p2-touch-group').classList.remove('hidden');
                    document.getElementById('p1-touch-group').classList.add('hidden');
                    document.getElementById('tab-p2-btn').className = 'text-xs font-bold text-green-400 bg-neutral-700 px-3 py-1 rounded border border-green-500';
                    document.getElementById('tab-p1-btn').className = 'text-xs font-bold text-yellow-400 bg-neutral-900 px-3 py-1 rounded border border-neutral-600';
                });

                // Canvas Title Screen Touch Selector
                this.canvas.addEventListener('click', (e) => {
                    audio.init();
                    if (this.state === 'TITLE') {
                        const rect = this.canvas.getBoundingClientRect();
                        const clickY = e.clientY - rect.top;
                        if (clickY > 180 && clickY < 230) {
                            this.selectedMenuOption = 0;
                            this.isTwoPlayer = false;
                            this.startNewGame();
                        } else if (clickY >= 230 && clickY < 280) {
                            this.selectedMenuOption = 1;
                            this.isTwoPlayer = true;
                            this.startNewGame();
                        }
                    } else if (this.state === 'GAME_OVER') {
                        this.state = 'TITLE';
                    }
                });
            }

            togglePause() {
                if (this.state === 'PLAYING') this.state = 'PAUSED';
                else if (this.state === 'PAUSED') this.state = 'PLAYING';
            }

            startNewGame() {
                this.p1Score = 0;
                this.p1Lives = 10;
                this.p2Score = 0;
                this.p2Lives = 10;
                this.stage = 1;

                document.getElementById('p2-hud-box').style.display = this.isTwoPlayer ? 'flex' : 'none';
                document.getElementById('mode-display-val').innerText = this.isTwoPlayer ? '2-PLAYER' : '1-PLAYER';

                this.startStage(this.stage);
            }

            startStage(stageNum) {
                this.stage = stageNum;
                this.map = createStageMap(stageNum);
                this.bullets = [];
                this.explosions = [];
                this.powerUps = [];
                this.enemies = [];
                this.freezeEnemiesTimer = 0;
                this.shovelTimer = 0;

                // Spawn Player 1 (Yellow) at Col 8, Row 24
                this.player1 = new Tank(8 * TILE_SIZE, 24 * TILE_SIZE, 1);

                // Spawn Player 2 (Green) at Col 16, Row 24 if 2 Player mode active
                if (this.isTwoPlayer && this.p2Lives > 0) {
                    this.player2 = new Tank(16 * TILE_SIZE, 24 * TILE_SIZE, 2);
                } else {
                    this.player2 = null;
                }

                // Prepare Stage Enemy Reserve (20 tanks per stage)
                this.remainingEnemiesToSpawn = [];
                for (let i = 0; i < 20; i++) {
                    let type = 'basic';
                    if (i > 4 && i % 3 === 0) type = 'fast';
                    if (i > 8 && i % 4 === 0) type = 'power';
                    if (i > 12 && i % 5 === 0) type = 'armor';
                    this.remainingEnemiesToSpawn.push(type);
                }

                this.state = 'STAGE_INTRO';
                audio.playStartJingle();

                setTimeout(() => {
                    if (this.state === 'STAGE_INTRO') this.state = 'PLAYING';
                }, 2000);

                this.updateHUD();
            }

            updateHUD() {
                document.getElementById('p1-score-val').innerText = String(this.p1Score).padStart(4, '0');
                document.getElementById('p1-lives-val').innerText = this.p1Lives;
                document.getElementById('p1-tier-val').innerText = this.player1 ? this.player1.tier : 0;

                if (this.isTwoPlayer) {
                    document.getElementById('p2-score-val').innerText = String(this.p2Score).padStart(4, '0');
                    document.getElementById('p2-lives-val').innerText = this.p2Lives;
                    document.getElementById('p2-tier-val').innerText = this.player2 ? this.player2.tier : 0;
                }

                document.getElementById('stage-num-val').innerText = this.stage;

                const topScore = Math.max(this.p1Score, this.p2Score);
                if (topScore > this.highScore) {
                    this.highScore = topScore;
                    localStorage.setItem('bc_high_score_2p', this.highScore);
                    document.getElementById('high-score-val').innerText = String(this.highScore).padStart(6, '0');
                }

                // Render Reserve Enemies Grid Icons
                const iconsContainer = document.getElementById('enemy-icons-container');
                iconsContainer.innerHTML = '';
                const totalRemaining = this.remainingEnemiesToSpawn.length + this.enemies.length;
                for (let i = 0; i < totalRemaining; i++) {
                    const icon = document.createElement('div');
                    icon.className = 'w-2 h-2 sm:w-2.5 sm:h-2.5 bg-neutral-400 border border-black rounded-sm';
                    iconsContainer.appendChild(icon);
                }
            }

            spawnEnemy() {
                if (this.remainingEnemiesToSpawn.length === 0 || this.enemies.length >= 4) return;

                const spawnCols = [0, 12, 24];
                const col = spawnCols[Math.floor(Math.random() * spawnCols.length)];
                const spawnX = col * TILE_SIZE;
                const spawnY = 0;

                const testBounds = { left: spawnX, right: spawnX + 28, top: spawnY, bottom: spawnY + 28 };
                const activeTanks = [...this.enemies];
                if (this.player1) activeTanks.push(this.player1);
                if (this.player2) activeTanks.push(this.player2);

                for (let tank of activeTanks) {
                    const ob = tank.getBounds();
                    if (testBounds.left < ob.right && testBounds.right > ob.left &&
                        testBounds.top < ob.bottom && testBounds.bottom > ob.top) {
                        return; // Spawn point occupied
                    }
                }

                const enemyType = this.remainingEnemiesToSpawn.shift();
                const newEnemy = new Tank(spawnX, spawnY, 0, enemyType);

                if (Math.random() < 0.35) newEnemy.isFlashing = true;

                this.enemies.push(newEnemy);
                this.updateHUD();
            }

            triggerPowerUp(type, collectorPlayerId) {
                audio.playPowerup();
                
                if (collectorPlayerId === 1) this.p1Score += 500;
                else if (collectorPlayerId === 2) this.p2Score += 500;

                if (type === 'star') {
                    if (collectorPlayerId === 1 && this.player1) this.player1.tier = Math.min(3, this.player1.tier + 1);
                    if (collectorPlayerId === 2 && this.player2) this.player2.tier = Math.min(3, this.player2.tier + 1);
                } else if (type === 'bomb') {
                    this.enemies.forEach(enemy => {
                        this.explosions.push(new Explosion(enemy.x + 14, enemy.y + 14, true));
                        if (collectorPlayerId === 1) this.p1Score += 100;
                        else this.p2Score += 100;
                    });
                    this.enemies = [];
                    audio.playExplosion(true);
                } else if (type === 'clock') {
                    this.freezeEnemiesTimer = 600;
                } else if (type === 'shovel') {
                    this.shovelTimer = 900;
                    this.setBaseFortressType(TILE_STEEL);
                } else if (type === 'helmet') {
                    if (collectorPlayerId === 1 && this.player1) this.player1.invincibleTimer = 600;
                    if (collectorPlayerId === 2 && this.player2) this.player2.invincibleTimer = 600;
                } else if (type === 'tank') {
                    if (collectorPlayerId === 1) this.p1Lives++;
                    if (collectorPlayerId === 2) this.p2Lives++;
                }

                this.updateHUD();
            }

            setBaseFortressType(tileType) {
                const baseBricks = [
                    [23,11],[23,12],[23,13],[23,14],
                    [24,11],[24,14],
                    [25,11],[25,14]
                ];
                baseBricks.forEach(([r, c]) => {
                    if (this.map[r][c] !== TILE_EAGLE_DESTROYED) {
                        this.map[r][c] = tileType;
                    }
                });
            }

            update() {
                if (this.state !== 'PLAYING') return;

                if (this.freezeEnemiesTimer > 0) this.freezeEnemiesTimer--;
                if (this.shovelTimer > 0) {
                    this.shovelTimer--;
                    if (this.shovelTimer === 0) this.setBaseFortressType(TILE_BRICK);
                }

                this.spawnTimer++;
                if (this.spawnTimer >= 120) {
                    this.spawnTimer = 0;
                    this.spawnEnemy();
                }

                const activeTanksList = [...this.enemies];
                if (this.player1) activeTanksList.push(this.player1);
                if (this.player2) activeTanksList.push(this.player2);

                // --- Player 1 Controls & Physics ---
                if (this.player1) {
                    this.player1.update(this.map, activeTanksList, false);

                    let p1MoveDir = null;
                    if (this.keys['w'] || this.keys['keyw']) p1MoveDir = DIR.UP;
                    else if (this.keys['d'] || this.keys['keyd']) p1MoveDir = DIR.RIGHT;
                    else if (this.keys['s'] || this.keys['keys']) p1MoveDir = DIR.DOWN;
                    else if (this.keys['a'] || this.keys['keya']) p1MoveDir = DIR.LEFT;
                    else if (this.p1TouchDir !== null) p1MoveDir = this.p1TouchDir;

                    if (p1MoveDir !== null) {
                        this.player1.move(p1MoveDir, this.map, activeTanksList.filter(t => t !== this.player1));
                    }

                    if (this.keys[' '] || this.keys['j'] || this.keys['keyj'] || this.p1TouchFire) {
                        const p1BulletsCount = this.bullets.filter(b => b.ownerPlayerId === 1).length;
                        const b = this.player1.shoot(p1BulletsCount);
                        if (b) this.bullets.push(b);
                    }
                }

                // --- Player 2 Controls & Physics ---
                if (this.player2) {
                    this.player2.update(this.map, activeTanksList, false);

                    let p2MoveDir = null;
                    if (this.keys['arrowup']) p2MoveDir = DIR.UP;
                    else if (this.keys['arrowright']) p2MoveDir = DIR.RIGHT;
                    else if (this.keys['arrowdown']) p2MoveDir = DIR.DOWN;
                    else if (this.keys['arrowleft']) p2MoveDir = DIR.LEFT;
                    else if (this.p2TouchDir !== null) p2MoveDir = this.p2TouchDir;

                    if (p2MoveDir !== null) {
                        this.player2.move(p2MoveDir, this.map, activeTanksList.filter(t => t !== this.player2));
                    }

                    if (this.keys['enter'] || this.keys['k'] || this.keys['keyk'] || this.keys['numpad0'] || this.p2TouchFire) {
                        const p2BulletsCount = this.bullets.filter(b => b.ownerPlayerId === 2).length;
                        const b = this.player2.shoot(p2BulletsCount);
                        if (b) this.bullets.push(b);
                    }
                }

                // --- Enemy AI Physics ---
                this.enemies.forEach(enemy => {
                    enemy.update(this.map, activeTanksList, this.freezeEnemiesTimer > 0);

                    if (this.freezeEnemiesTimer <= 0) {
                        enemy.aiChangeDirTimer++;
                        if (enemy.aiChangeDirTimer > 60 || !enemy.move(enemy.dir, this.map, activeTanksList.filter(t => t !== enemy))) {
                            enemy.aiChangeDirTimer = 0;
                            const rand = Math.random();
                            if (rand < 0.45) enemy.dir = DIR.DOWN;
                            else if (rand < 0.65) enemy.dir = DIR.LEFT;
                            else if (rand < 0.85) enemy.dir = DIR.RIGHT;
                            else enemy.dir = DIR.UP;
                        }

                        if (Math.random() < 0.03) {
                            const enemyBulletsCount = this.bullets.filter(b => b.ownerPlayerId === 0).length;
                            const eb = enemy.shoot(enemyBulletsCount);
                            if (eb) this.bullets.push(eb);
                        }
                    }
                });

                // --- Bullets Collision Engine ---
                this.bullets.forEach(b => b.update());
                this.bullets = this.bullets.filter(b => b.active);

                for (let b of this.bullets) {
                    if (!b.active) continue;

                    const bb = b.getBounds();

                    // Bullet vs Map Tile Collision
                    const leftTile = Math.floor(bb.left / TILE_SIZE);
                    const rightTile = Math.floor(bb.right / TILE_SIZE);
                    const topTile = Math.floor(bb.top / TILE_SIZE);
                    const bottomTile = Math.floor(bb.bottom / TILE_SIZE);

                    let hitObstacle = false;

                    for (let r = topTile; r <= bottomTile; r++) {
                        for (let c = leftTile; c <= rightTile; c++) {
                            if (r < 0 || r >= MAP_SIZE || c < 0 || c >= MAP_SIZE) continue;

                            const tile = this.map[r][c];

                            if (tile === TILE_BRICK) {
                                this.map[r][c] = TILE_EMPTY;
                                hitObstacle = true;
                                audio.playBrickHit();
                            } else if (tile === TILE_STEEL) {
                                hitObstacle = true;
                                if (b.tier >= 3) {
                                    this.map[r][c] = TILE_EMPTY;
                                }
                                audio.playSteelHit();
                            } else if (tile === TILE_EAGLE) {
                                this.map[24][12] = TILE_EAGLE_DESTROYED;
                                this.map[24][13] = TILE_EAGLE_DESTROYED;
                                this.map[25][12] = TILE_EAGLE_DESTROYED;
                                this.map[25][13] = TILE_EAGLE_DESTROYED;
                                hitObstacle = true;
                                this.explosions.push(new Explosion(13 * TILE_SIZE, 25 * TILE_SIZE, true));
                                audio.playExplosion(true);
                                this.triggerGameOver();
                            }
                        }
                    }

                    if (hitObstacle) {
                        b.active = false;
                        this.explosions.push(new Explosion(b.x, b.y, false));
                        continue;
                    }

                    // Bullet vs Bullet Collisions
                    for (let otherB of this.bullets) {
                        if (b === otherB || !otherB.active) continue;
                        const obb = otherB.getBounds();
                        if (bb.left < obb.right && bb.right > obb.left && bb.top < obb.bottom && bb.bottom > obb.top) {
                            b.active = false;
                            otherB.active = false;
                            this.explosions.push(new Explosion(b.x, b.y, false));
                            break;
                        }
                    }

                    if (!b.active) continue;

                    // Player Shot (P1 or P2)
                    if (b.ownerPlayerId > 0) {
                        // Check Enemy Hits
                        for (let enemy of this.enemies) {
                            const eb = enemy.getBounds();
                            if (bb.left < eb.right && bb.right > eb.left && bb.top < eb.bottom && bb.bottom > eb.top) {
                                b.active = false;
                                enemy.hp--;

                                if (enemy.hp <= 0) {
                                    this.explosions.push(new Explosion(enemy.x + 14, enemy.y + 14, true));
                                    audio.playExplosion(true);

                                    if (enemy.isFlashing) {
                                        const pTypes = ['star', 'bomb', 'clock', 'shovel', 'helmet', 'tank'];
                                        const chosenType = pTypes[Math.floor(Math.random() * pTypes.length)];
                                        const px = Math.min(CANVAS_SIZE - 28, Math.max(16, enemy.x));
                                        const py = Math.min(CANVAS_SIZE - 28, Math.max(16, enemy.y));
                                        this.powerUps.push(new PowerUp(px, py, chosenType));
                                    }

                                    const pts = enemy.enemyType === 'armor' ? 400 : 100;
                                    if (b.ownerPlayerId === 1) this.p1Score += pts;
                                    else if (b.ownerPlayerId === 2) this.p2Score += pts;

                                    this.enemies = this.enemies.filter(e => e !== enemy);
                                    this.updateHUD();

                                    if (this.enemies.length === 0 && this.remainingEnemiesToSpawn.length === 0) {
                                        this.triggerStageClear();
                                    }
                                } else {
                                    audio.playBrickHit();
                                }
                                break;
                            }
                        }

                        // PVP Mechanics
                        const handlePvPDamage = (targetPlayer, targetId) => {
                            if (targetPlayer && targetPlayer.invincibleTimer <= 0) {
                                b.active = false;
                                this.explosions.push(new Explosion(targetPlayer.x + 14, targetPlayer.y + 14, true));
                                audio.playExplosion(true);
                                
                                if (targetId === 1) {
                                    this.p1Lives--;
                                    if (this.p1Lives <= 0) this.player1 = null;
                                    else this.player1 = new Tank(8 * TILE_SIZE, 24 * TILE_SIZE, 1);
                                } else {
                                    this.p2Lives--;
                                    if (this.p2Lives <= 0) this.player2 = null;
                                    else this.player2 = new Tank(16 * TILE_SIZE, 24 * TILE_SIZE, 2);
                                }
                                
                                this.updateHUD();
                                
                                if (!this.player1 && (!this.isTwoPlayer || !this.player2)) {
                                    this.triggerGameOver();
                                }
                            }
                        };

                        if (b.ownerPlayerId === 1 && this.player2) {
                            const pb2 = this.player2.getBounds();
                            if (bb.left < pb2.right && bb.right > pb2.left && bb.top < pb2.bottom && bb.bottom > pb2.top) {
                                handlePvPDamage(this.player2, 2);
                            }
                        } else if (b.ownerPlayerId === 2 && this.player1) {
                            const pb1 = this.player1.getBounds();
                            if (bb.left < pb1.right && bb.right > pb1.left && bb.top < pb1.bottom && bb.bottom > pb1.top) {
                                handlePvPDamage(this.player1, 1);
                            }
                        }

                    } 
                    // Enemy Shot hitting Player 1 or Player 2
                    else {
                        const checkPlayerHit = (playerObj, playerId) => {
                            if (!playerObj) return false;
                            const pb = playerObj.getBounds();
                            if (bb.left < pb.right && bb.right > pb.left && bb.top < pb.bottom && bb.bottom > pb.top) {
                                b.active = false;
                                if (playerObj.invincibleTimer <= 0) {
                                    this.explosions.push(new Explosion(playerObj.x + 14, playerObj.y + 14, true));
                                    audio.playExplosion(true);

                                    if (playerId === 1) {
                                        this.p1Lives--;
                                        if (this.p1Lives <= 0) this.player1 = null;
                                        else this.player1 = new Tank(8 * TILE_SIZE, 24 * TILE_SIZE, 1);
                                    } else {
                                        this.p2Lives--;
                                        if (this.p2Lives <= 0) this.player2 = null;
                                        else this.player2 = new Tank(16 * TILE_SIZE, 24 * TILE_SIZE, 2);
                                    }

                                    this.updateHUD();

                                    if (!this.player1 && (!this.isTwoPlayer || !this.player2)) {
                                        this.triggerGameOver();
                                    }
                                }
                                return true;
                            }
                            return false;
                        };

                        if (!checkPlayerHit(this.player1, 1)) {
                            checkPlayerHit(this.player2, 2);
                        }
                    }
                }

                // PowerUp Pickups
                this.powerUps.forEach(p => p.update());
                this.powerUps = this.powerUps.filter(p => p.duration > 0);

                const checkPowerUpPickup = (playerObj, playerId) => {
                    if (!playerObj) return;
                    const pb = playerObj.getBounds();
                    this.powerUps.forEach((p, idx) => {
                        if (pb.left < p.x + 24 && pb.right > p.x && pb.top < p.y + 24 && pb.bottom > p.y) {
                            this.triggerPowerUp(p.type, playerId);
                            this.powerUps.splice(idx, 1);
                        }
                    });
                };

                checkPowerUpPickup(this.player1, 1);
                checkPowerUpPickup(this.player2, 2);

                // Explosions Update
                this.explosions.forEach(exp => exp.update());
                this.explosions = this.explosions.filter(exp => !exp.finished);
            }

            triggerStageClear() {
                this.state = 'STAGE_CLEAR';
                audio.playStartJingle();
                setTimeout(() => {
                    if (this.stage >= 35) {
                        this.ctx.fillStyle = 'rgba(0,0,0,0.85)';
                        this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        this.ctx.fillStyle = '#ffea00';
                        this.ctx.font = '24px "Press Start 2P"';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText('YOU WIN!', CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                        setTimeout(() => this.triggerGameOver(), 3000);
                    } else {
                        this.startStage(this.stage + 1);
                    }
                }, 2500);
            }

            triggerGameOver() {
                this.state = 'GAME_OVER';
                audio.playGameOver();
            }

            draw() {
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                if (this.state === 'TITLE') {
                    this.drawTitleScreen();
                    return;
                }

                // 1. Ice & Water Tiles (Ground Level)
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        const tile = this.map[r][c];
                        const tx = c * TILE_SIZE;
                        const ty = r * TILE_SIZE;

                        if (tile === TILE_ICE) {
                            this.ctx.fillStyle = '#99ffff';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#ffffff';
                            this.ctx.fillRect(tx + 2, ty + 2, 4, 2);
                        } else if (tile === TILE_WATER) {
                            this.ctx.fillStyle = (Math.floor(Date.now() / 300) % 2 === 0) ? '#0044cc' : '#0066ff';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#66a3ff';
                            this.ctx.fillRect(tx + 2, ty + 4, 8, 2);
                        }
                    }
                }

                // 2. Tanks & Powerups
                if (this.player1) this.player1.draw(this.ctx);
                if (this.player2) this.player2.draw(this.ctx);
                this.enemies.forEach(e => e.draw(this.ctx));
                this.powerUps.forEach(p => p.draw(this.ctx));

                // 3. Solid Tiles (Bricks, Steel, Eagle)
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        const tile = this.map[r][c];
                        const tx = c * TILE_SIZE;
                        const ty = r * TILE_SIZE;

                        if (tile === TILE_BRICK) {
                            this.ctx.fillStyle = '#b23b00';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.strokeStyle = '#000000';
                            this.ctx.lineWidth = 1;
                            this.ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#e65c00';
                            this.ctx.fillRect(tx + 2, ty + 2, 5, 4);
                        } else if (tile === TILE_STEEL) {
                            this.ctx.fillStyle = '#cccccc';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#ffffff';
                            this.ctx.fillRect(tx, ty, 4, 4);
                            this.ctx.fillRect(tx + 8, ty + 8, 4, 4);
                            this.ctx.strokeStyle = '#666';
                            this.ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
                        } else if (tile === TILE_EAGLE) {
                            this.ctx.fillStyle = '#ffb300';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#000';
                            this.ctx.font = '10px sans-serif';
                            this.ctx.fillText('🦅', tx + 1, ty + 12);
                        } else if (tile === TILE_EAGLE_DESTROYED) {
                            this.ctx.fillStyle = '#555';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#000';
                            this.ctx.fillText('💀', tx + 1, ty + 12);
                        }
                    }
                }

                // 4. Bullets
                this.bullets.forEach(b => b.draw(this.ctx));

                // 5. Trees / Bushes (Overlay Layer over tanks)
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        if (this.map[r][c] === TILE_TREES) {
                            const tx = c * TILE_SIZE;
                            const ty = r * TILE_SIZE;
                            this.ctx.fillStyle = '#00a800';
                            this.ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                            this.ctx.fillStyle = '#004d00';
                            this.ctx.fillRect(tx + 2, ty + 2, 4, 4);
                            this.ctx.fillRect(tx + 10, ty + 8, 4, 4);
                        }
                    }
                }

                // 6. Explosions
                this.explosions.forEach(exp => exp.draw(this.ctx));

                // Overlays
                if (this.state === 'STAGE_INTRO') {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '20px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`STAGE ${this.stage}`, CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                } else if (this.state === 'PAUSED') {
                    this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    this.ctx.fillStyle = '#ffea00';
                    this.ctx.font = '22px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('PAUSE', CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                } else if (this.state === 'STAGE_CLEAR') {
                    this.ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    this.ctx.fillStyle = '#00e676';
                    this.ctx.font = '20px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('STAGE CLEAR!', CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                } else if (this.state === 'GAME_OVER') {
                    this.ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    this.ctx.fillStyle = '#e62020';
                    this.ctx.font = '24px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('GAME OVER', CANVAS_SIZE / 2, CANVAS_SIZE / 2 - 20);

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '9px "Press Start 2P"';
                    this.ctx.fillText('PRESS ENTER OR TAP TO MENU', CANVAS_SIZE / 2, CANVAS_SIZE / 2 + 30);
                }
            }

            drawTitleScreen() {
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                this.ctx.fillStyle = '#ff2200';
                this.ctx.font = '22px "Press Start 2P"';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('BATTLE CITY', CANVAS_SIZE / 2, 80);

                this.ctx.fillStyle = '#ffea00';
                this.ctx.font = '10px "Press Start 2P"';
                this.ctx.fillText('1990 RETRO NES TANKS', CANVAS_SIZE / 2, 110);

                // Mode Options Menu
                this.ctx.font = '12px "Press Start 2P"';

                // 1 Player Option
                if (this.selectedMenuOption === 0) {
                    this.ctx.fillStyle = '#ffff00';
                    this.ctx.fillText('▶ 1 PLAYER', CANVAS_SIZE / 2, 200);
                } else {
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText('  1 PLAYER', CANVAS_SIZE / 2, 200);
                }

                // 2 Players Co-op Option
                if (this.selectedMenuOption === 1) {
                    this.ctx.fillStyle = '#00e676';
                    this.ctx.fillText('▶ 2 PLAYERS CO-OP', CANVAS_SIZE / 2, 240);
                } else {
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText('  2 PLAYERS CO-OP', CANVAS_SIZE / 2, 240);
                }

                // Dual Tank Icons Display
                this.ctx.fillStyle = '#e69d00'; // P1 Yellow
                this.ctx.fillRect(CANVAS_SIZE / 2 - 40, 280, 24, 24);
                this.ctx.fillStyle = '#00c853'; // P2 Green
                this.ctx.fillRect(CANVAS_SIZE / 2 + 16, 280, 24, 24);

                this.ctx.fillStyle = '#aaaaaa';
                this.ctx.font = '8px "Press Start 2P"';
                this.ctx.fillText('USE ARROWS / W-S TO SELECT', CANVAS_SIZE / 2, 340);
                this.ctx.fillText('PRESS ENTER / SPACE TO START', CANVAS_SIZE / 2, 360);
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(this.loop);
            }
        }

        window.addEventListener('load', () => {
            new BattleCityGame();
        });
    </script>
</body>
